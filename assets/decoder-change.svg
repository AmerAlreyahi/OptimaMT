<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15">
  <rect width="960" height="520" rx="14" fill="#fcfcfb"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8984"/></marker>
  </defs>
  <style>
    .t { fill: #0b0b0b; } .m { fill: #52514e; font-size: 13px; } .h { font-weight: 700; font-size: 18px; fill: #0b0b0b; }
    .node { fill: #ffffff; stroke: #c9c8c3; stroke-width: 1.5; }
    .dup { fill: #fdeee7; stroke: #eb6834; stroke-width: 2; }
    .one { fill: #e6f0fb; stroke: #2a78d6; stroke-width: 2; }
    .branch { fill: none; stroke: #c9c8c3; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .arrow { stroke: #8a8984; stroke-width: 1.6; fill: none; }
  </style>

  <!-- OLD -->
  <text x="30" y="40" class="h">Old: original merged decoder</text>
  <rect x="140" y="62" width="200" height="40" rx="8" class="node"/>
  <text x="240" y="80" text-anchor="middle" class="t">model.shared.weight</text>
  <text x="240" y="96" text-anchor="middle" class="m">8-bit initializer</text>
  <line x1="240" y1="102" x2="240" y2="126" class="arrow" marker-end="url(#a)"/>
  <path d="M240 128 L276 150 L240 172 L204 150 Z" class="node"/>
  <text x="240" y="155" text-anchor="middle" class="t" font-weight="600">If</text>
  <path d="M212 160 C170 175, 130 180, 125 200" class="arrow" marker-end="url(#a)"/>
  <path d="M268 160 C310 175, 350 180, 355 200" class="arrow" marker-end="url(#a)"/>

  <rect x="30" y="202" width="190" height="250" rx="12" class="branch"/>
  <text x="125" y="226" text-anchor="middle" class="t" font-weight="600">branch 1: no_past</text>
  <text x="125" y="244" text-anchor="middle" class="m">first step</text>
  <rect x="45" y="258" width="160" height="40" rx="8" class="dup"/>
  <text x="125" y="283" text-anchor="middle" class="t">Transpose</text>
  <line x1="125" y1="298" x2="125" y2="316" class="arrow" marker-end="url(#a)"/>
  <rect x="45" y="318" width="160" height="40" rx="8" class="dup"/>
  <text x="125" y="343" text-anchor="middle" class="t">DequantizeLinear</text>
  <line x1="125" y1="358" x2="125" y2="376" class="arrow" marker-end="url(#a)"/>
  <rect x="45" y="378" width="160" height="40" rx="8" class="node"/>
  <text x="125" y="403" text-anchor="middle" class="t">MatMul → logits</text>

  <rect x="260" y="202" width="190" height="250" rx="12" class="branch"/>
  <text x="355" y="226" text-anchor="middle" class="t" font-weight="600">branch 2: with_past</text>
  <text x="355" y="244" text-anchor="middle" class="m">every later step</text>
  <rect x="275" y="258" width="160" height="40" rx="8" class="dup"/>
  <text x="355" y="283" text-anchor="middle" class="t">Transpose</text>
  <line x1="355" y1="298" x2="355" y2="316" class="arrow" marker-end="url(#a)"/>
  <rect x="275" y="318" width="160" height="40" rx="8" class="dup"/>
  <text x="355" y="343" text-anchor="middle" class="t">DequantizeLinear</text>
  <line x1="355" y1="358" x2="355" y2="376" class="arrow" marker-end="url(#a)"/>
  <rect x="275" y="378" width="160" height="40" rx="8" class="node"/>
  <text x="355" y="403" text-anchor="middle" class="t">MatMul → logits</text>

  <rect x="30" y="462" width="14" height="14" rx="3" class="dup"/>
  <text x="52" y="474" class="m">the same two steps, duplicated in both branches</text>

  <line x1="480" y1="40" x2="480" y2="470" stroke="#e4e3df" stroke-width="1.5"/>

  <!-- NEW -->
  <text x="510" y="40" class="h">New: rebuilt decoder</text>
  <rect x="620" y="62" width="200" height="40" rx="8" class="node"/>
  <text x="720" y="80" text-anchor="middle" class="t">model.shared.weight</text>
  <text x="720" y="96" text-anchor="middle" class="m">8-bit initializer</text>
  <line x1="720" y1="102" x2="720" y2="120" class="arrow" marker-end="url(#a)"/>
  <rect x="640" y="122" width="160" height="40" rx="8" class="one"/>
  <text x="720" y="147" text-anchor="middle" class="t">Transpose</text>
  <line x1="720" y1="162" x2="720" y2="180" class="arrow" marker-end="url(#a)"/>
  <rect x="640" y="182" width="160" height="40" rx="8" class="one"/>
  <text x="720" y="207" text-anchor="middle" class="t">DequantizeLinear</text>
  <line x1="720" y1="222" x2="720" y2="244" class="arrow" marker-end="url(#a)"/>
  <path d="M720 246 L756 268 L720 290 L684 268 Z" class="node"/>
  <text x="720" y="273" text-anchor="middle" class="t" font-weight="600">If</text>
  <path d="M692 278 C650 293, 610 300, 605 318" class="arrow" marker-end="url(#a)"/>
  <path d="M748 278 C790 293, 830 300, 835 318" class="arrow" marker-end="url(#a)"/>

  <rect x="510" y="320" width="190" height="132" rx="12" class="branch"/>
  <text x="605" y="344" text-anchor="middle" class="t" font-weight="600">branch 1: no_past</text>
  <text x="605" y="362" text-anchor="middle" class="m">first step</text>
  <rect x="525" y="378" width="160" height="40" rx="8" class="node"/>
  <text x="605" y="403" text-anchor="middle" class="t">MatMul → logits</text>

  <rect x="740" y="320" width="190" height="132" rx="12" class="branch"/>
  <text x="835" y="344" text-anchor="middle" class="t" font-weight="600">branch 2: with_past</text>
  <text x="835" y="362" text-anchor="middle" class="m">every later step</text>
  <rect x="755" y="378" width="160" height="40" rx="8" class="node"/>
  <text x="835" y="403" text-anchor="middle" class="t">MatMul → logits</text>

  <rect x="510" y="462" width="14" height="14" rx="3" class="one"/>
  <text x="532" y="474" class="m">the same two steps, once, before the If</text>

  <text x="480" y="506" text-anchor="middle" class="t" font-weight="600">Old: folded once per branch (2 float copies). New: folded once (1 copy).</text>
</svg>
